appId: com.getmailpilot.desktop
productName: Mail Pilot
copyright: Copyright © Areal
artifactName: Mail-Pilot-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true
npmRebuild: false
protocols:
  - name: Mail Pilot
    schemes:
      - mailpilot
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
